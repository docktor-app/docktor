# Build Docktor from source instead of pulling the published image (D-07).
#
# Use as an override on top of the main compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Everything else (database, volumes, environment) comes from docker-compose.yml.

services:
  docktor:
    # A distinct local tag so a from-source build never shadows
    # ghcr.io/docktor-app/docktor:latest for a later plain `docker compose up`.
    image: docktor:local
    build:
      context: .
    pull_policy: build
