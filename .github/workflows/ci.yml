name: CI

# CI for pull requests runs from this file directly. Pushes to main and v* release
# tags no longer trigger it on their own: publish.yml calls it (workflow_call) as its
# first job and only builds and pushes the image once it has passed, so main and tag
# CI runs appear inside the "Publish" workflow run.
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      BETTER_AUTH_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn exec prisma generate --config=server/prisma/prisma.config.ts

      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests (client + shared)
        run: yarn test:unit

      - name: Server tests (unit + integration combined for accurate coverage)
        run: yarn workspace @docktor/server test

      - name: Install Playwright browsers
        run: yarn workspace @docktor/client exec playwright install --with-deps chromium

      - name: Client integration tests
        env:
          VITE_COVERAGE: "true"
        run: yarn test:integration

      - name: Fix coverage paths for SonarQube
        if: always()
        run: |
          for pkg in server client shared; do
            lcov="$pkg/.test/coverage/lcov.info"
            if [ -f "$lcov" ]; then
              sed -i "s|^SF:src/|SF:$pkg/src/|" "$lcov"
            fi
          done

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-reports
          path: |
            server/.test/coverage/lcov.info
            client/.test/coverage/lcov.info
            shared/.test/coverage/lcov.info
          retention-days: 5

  cross-platform-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      BETTER_AUTH_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn exec prisma generate --config=server/prisma/prisma.config.ts

      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests (client + shared)
        run: yarn test:unit

      - name: Server unit tests
        run: yarn workspace @docktor/server test:unit

  # Runs the copy tests as root on Linux (#109): the ownership-preservation test is skipped for a
  # non-root user, so DOCKTOR_REQUIRE_ROOT_TESTS makes the suite assert root and fail the job
  # instead of skipping silently. DOCKTOR_REAL_DOCKER_TESTS runs the real `docker compose config`
  # interpolation test against the preinstalled Docker on the runner.
  linux-root-migration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared
        run: yarn workspace @docktor/shared build

      - name: Migration copy and compose interpolation tests as root
        env:
          DOCKTOR_REQUIRE_ROOT_TESTS: "1"
          DOCKTOR_REAL_DOCKER_TESTS: "1"
          NODE_ENV: test
          BETTER_AUTH_SECRET: ci-test-secret
        run: sudo -E env "PATH=$PATH" yarn workspace @docktor/server exec vitest run --project unit --coverage.enabled=false test/unit/infrastructure/volume-migrator.test.ts test/unit/infrastructure/compose-env-interpolation.test.ts

  sonarqube:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-reports

      - name: SonarQube Scan for PR
        uses: sonarsource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            --define sonar.pullrequest.key=${{ github.event.pull_request.number }}
            --define sonar.pullrequest.branch=${{ github.head_ref || github.ref_name }}
            --define sonar.pullrequest.base=main

      - name: SonarQube Scan for Main
        uses: sonarsource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            --define sonar.branch.name=main

  # Builds the production image from a clean checkout on every pull request (amd64
  # only, to bound PR time; arm64 is built by publish.yml) and proves the startup
  # environment check (#7) rejects an empty environment inside the real image.
  docker-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: docktor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Startup check rejects an empty environment (#7)
        run: |
          set +e
          output=$(docker run --rm docktor:ci 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 from an empty environment, got $code" >&2
            exit 1
          fi
          for name in DATABASE_URL BETTER_AUTH_SECRET BETTER_AUTH_URL ENCRYPTION_KEY; do
            if ! printf '%s\n' "$output" | grep -q "$name"; then
              echo "Startup report does not mention $name" >&2
              exit 1
            fi
          done
